<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Team Barsco Logo</title>
  <desc id="desc">Circular emblem with TB monogram using brand colors</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <circle cx="64" cy="64" r="60" fill="#2c3e50"/>
    <circle cx="64" cy="64" r="60" fill="none" stroke="#27ae60" stroke-width="4"/>
  </g>
  <g aria-hidden="true">
    <text x="64" y="74" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="1">
      TB
    </text>
    <circle cx="96" cy="32" r="6" fill="#27ae60"/>
  </g>
</svg>


